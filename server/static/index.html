<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>A股量化助手</title>
    <!-- 主题首帧（2026-10-13）：暗色改由 [data-theme] 控制后，必须在样式生效前写好属性，
       否则暗色偏好用户每次打开都会先看到亮的一瞬。 -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('gupiao_theme')
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-DJ_pQ8ZS.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DNuIeL9b.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
